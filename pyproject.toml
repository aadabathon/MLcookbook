[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlcookbook"
version = "0.1.0"
description = "A statistics, data science, and classical ML workbench for tabular datasets."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
gui = [
    "PySide6>=6.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mlcookbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
