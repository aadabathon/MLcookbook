name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check .

  core:
    # Library tests only: without the GUI extra, tests/test_app_import.py skips itself.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: python examples/basic_usage.py

  desktop:
    # The full suite, including the PySide6 app tests, on the platform the app ships for.
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,gui]"
      - name: Compile standalone graph capture helper
        run: |
          cmake -S tools/llama_research -B build/llama-research -A x64
          cmake --build build/llama-research --config Release
      - run: pytest

  llm:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      QT_QPA_PLATFORM: offscreen
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
      - run: pip install "torch>=2.6,<3" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,gui,llm]"
      # Real tiny checkpoints are constructed in tests; no model downloads.
      - run: pytest tests/test_llm.py tests/test_ollama.py tests/test_llamacpp.py tests/test_llm_workflow.py tests/test_app_import.py -k "llm or ollama or llamacpp or workflow"
